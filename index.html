<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <span class="logo">Gallery</span>
      <nav class="tabs">
        <button class="tab active" data-view="gallery">Gallery</button>
        <button class="tab" data-view="months">Months</button>
        <button class="tab" data-view="albums">Albums</button>
      </nav>
    </header>

    <main>
      <!-- Big title from your reference. Hidden when a month/album is open. -->
      <div class="hero" id="hero">
        <span class="pill">My Memories</span>
        <div class="hero-row">
          <h1>Photo Gallery</h1>
          <p>Captured moments from every trip.</p>
        </div>
      </div>

      <!-- 1. Clean mosaic of everything -->
      <section id="gallery-view" class="view">
        <div class="chips" id="chips"></div>
        <div class="photo-grid" id="gallery-grid"></div>
      </section>

      <!-- 2. One card per month -->
      <section id="months-view" class="view" hidden>
        <div class="album-grid" id="months-grid"></div>
      </section>

      <!-- 3. Albums + the "+" card -->
      <section id="albums-view" class="view" hidden>
        <div class="album-grid" id="albums-grid"></div>
      </section>

      <!-- 4. Opened month or album (one view reused for both) -->
      <section id="detail-view" class="view" hidden>
        <button class="back" id="back-btn">&larr; Back</button>
        <h2 class="detail-title" id="detail-title"></h2>
        <p class="detail-sub" id="detail-sub"></p>
        <div id="detail-content"></div>
      </section>
    </main>

    <!-- Lightbox -->
<div class="lightbox" id="lightbox" hidden>

  <div class="lb-top">
    <button class="lb-icon" id="lb-close" aria-label="Close">&larr;</button>

    <!-- Date button: clicking it jumps back to this photo in the gallery -->
    <button class="lb-when" id="lb-when" title="Show in gallery">
      <strong id="lb-date"></strong>
      <small id="lb-time"></small>
    </button>

    <div class="lb-top-actions">
      <button class="lb-icon" id="lb-fav" aria-label="Favourite">&#9734;</button>
      <button class="lb-icon" id="lb-more" aria-label="Details">&#9776;</button>
    </div>
  </div>

  <button class="lb-nav lb-prev" aria-label="Previous photo">&#8249;</button>
  <div class="lb-stage">
    <img class="lb-image" src="" alt="" />
  </div>
  <button class="lb-nav lb-next" aria-label="Next photo">&#8250;</button>

  <p class="lb-title" id="lb-title"></p>

  <!-- Bottom action bar -->
  <div class="lb-bottom" id="lb-bottom">
    <button data-action="share"><span>📤</span>Share</button>
    <button data-action="edit"><span>✏️</span>Edit</button>
    <button data-action="album"><span>➕</span>Add to</button>
    <button data-action="bin"><span>🗑️</span>Bin</button>
  </div>

  <!-- Edit panel (replaces the bottom bar while editing) -->
  <div class="lb-edit" id="lb-edit" hidden>
    <div class="edit-tabs">
      <button class="edit-tab active" data-tab="filters">Filters</button>
      <button class="edit-tab" data-tab="adjust">Adjust</button>
    </div>

    <div class="edit-panel" id="edit-filters"></div>

    <div class="edit-panel" id="edit-adjust" hidden>
      <label>Brightness <input type="range" min="50" max="150" value="100" data-adjust="brightness" /></label>
      <label>Contrast   <input type="range" min="50" max="150" value="100" data-adjust="contrast" /></label>
      <label>Saturation <input type="range" min="0"  max="200" value="100" data-adjust="saturate" /></label>
    </div>

    <div class="edit-actions">
      <button id="edit-reset">Reset</button>
      <button id="edit-cancel">Cancel</button>
      <button id="edit-save" class="primary">Save</button>
    </div>
  </div>
</div>

    <!-- Create album modal -->
    <div class="modal" id="album-modal" hidden>
      <div class="modal-box">
        <h3>New album</h3>
        <input
          id="album-name"
          type="text"
          placeholder="Album name"
          maxlength="40"
        />
        <p class="modal-hint">Tap photos to add them</p>
        <div class="picker" id="picker"></div>
        <div class="modal-actions">
          <button id="modal-cancel">Cancel</button>
          <button id="modal-save" class="primary">Create</button>
        </div>
      </div>
    </div>
<!-- Bottom sheet, reused for Share / Add to album / Details -->
<div class="sheet-backdrop" id="sheet" hidden>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3 id="sheet-title"></h3>
    <div id="sheet-body"></div>
  </div>
</div>

<!-- Small message at the bottom ("Moved to bin · Undo") -->
<div class="toast" id="toast" hidden></div>

  </body>
</html>
