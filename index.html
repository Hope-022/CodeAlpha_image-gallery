<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="style.css" />
  <script src="app.js" defer></script>
</head>
<body>

  <header class="site-header">
    <span class="logo">Gallery</span>
    <nav class="tabs">
      <button class="tab active" data-view="gallery">Gallery</button>
      <button class="tab" data-view="months">Months</button>
      <button class="tab" data-view="albums">Albums</button>
    </nav>
  </header>

  <main>
    <!-- Big title from your reference. Hidden when a month/album is open. -->
    <div class="hero" id="hero">
      <span class="pill">My Memories</span>
      <div class="hero-row">
        <h1>Photo Gallery</h1>
        <p>Captured moments from every trip, month by month.</p>
      </div>
    </div>

    <!-- 1. Clean mosaic of everything -->
    <section id="gallery-view" class="view">
      <div class="photo-grid" id="gallery-grid"></div>
    </section>

    <!-- 2. One card per month -->
    <section id="months-view" class="view" hidden>
      <div class="album-grid" id="months-grid"></div>
    </section>

    <!-- 3. Albums + the "+" card -->
    <section id="albums-view" class="view" hidden>
      <div class="album-grid" id="albums-grid"></div>
    </section>

    <!-- 4. Opened month or album (one view reused for both) -->
    <section id="detail-view" class="view" hidden>
      <button class="back" id="back-btn">&larr; Back</button>
      <h2 class="detail-title" id="detail-title"></h2>
      <p class="detail-sub" id="detail-sub"></p>
      <div id="detail-content"></div>
    </section>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" aria-label="Close">&times;</button>
    <button class="lb-prev" aria-label="Previous photo">&#8249;</button>
    <img class="lb-image" src="" alt="" />
    <button class="lb-next" aria-label="Next photo">&#8250;</button>
    <div class="lb-caption">
      <strong id="lb-title"></strong>
      <span id="lb-date"></span>
    </div>
  </div>

  <!-- Create album modal -->
  <div class="modal" id="album-modal" hidden>
    <div class="modal-box">
      <h3>New album</h3>
      <input id="album-name" type="text" placeholder="Album name" maxlength="40" />
      <p class="modal-hint">Tap photos to add them</p>
      <div class="picker" id="picker"></div>
      <div class="modal-actions">
        <button id="modal-cancel">Cancel</button>
        <button id="modal-save" class="primary">Create</button>
      </div>
    </div>
  </div>

</body>
</html>
